<!DOCTYPE html>
<html lang="ar" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Game.Over 01004161904 - Poops Chain</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    min-height: 100vh; color: #fff; font-family: 'Cairo', sans-serif;
    display: flex; align-items: center; justify-content: center; direction: ltr;
    background: url('bg.jpg') no-repeat center center fixed; background-size: cover;
  }

  .overlay { position: fixed; inset: 0; background: rgba(5, 10, 25, 0.75); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); z-index: -1; }

  .glass-panel {
    width: 95%; max-width: 800px; background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 25px; padding: 40px 30px;
    box-shadow: 0 25px 45px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(255, 255, 255, 0.05); text-align: center;
  }

  .01004161904-title { font-family: 'Montserrat', sans-serif; font-size: 4rem; font-weight: 900; letter-spacing: 2px; background: linear-gradient(135deg, #ffffff 0%, #0070cc 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 5px; filter: drop-shadow(0px 4px 10px rgba(0, 112, 204, 0.5)); }
  .owner-name { font-size: 1.5rem; font-weight: 900; color: #80bfff; margin-bottom: 25px; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5); letter-spacing: 3px; }

  .status-box { background: rgba(0, 0, 0, 0.4); border-radius: 15px; padding: 20px; margin-bottom: 20px; border: 1px solid rgba(0, 112, 204, 0.3); box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.8); }

  #state { font-size: 24px; font-weight: 900; color: #00e6ff; text-shadow: 0 0 10px rgba(0, 230, 255, 0.4); margin-bottom: 10px; }
  
  .loader-container { display: flex; justify-content: center; gap: 8px; margin-top: 10px; }
  .dot { width: 12px; height: 12px; background: #0070cc; border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; box-shadow: 0 0 10px #0070cc; }
  .dot:nth-child(1) { animation-delay: -0.32s; } .dot:nth-child(2) { animation-delay: -0.16s; }
  @keyframes bounce { 0%, 80%, 100% { transform: scale(0); opacity: 0.5; } 40% { transform: scale(1); opacity: 1; } }

  #out-container { position: absolute; width: 1px; height: 1px; overflow: hidden; opacity: 0; pointer-events: none; }
  #out { white-space: pre-wrap; font: 12px/1.45 Consolas, monospace; color: #c8ced8; }

  .done { color: #00ff88 !important; text-shadow: 0 0 10px #00ff88 !important; }
  .error { color: #ff3366 !important; text-shadow: 0 0 10px #ff3366 !important; }

  .footer { position: fixed; bottom: 15px; left: 0; width: 100%; text-align: center; font-family: 'Montserrat', sans-serif; font-size: 12px; color: rgba(255, 255, 255, 0.3); letter-spacing: 2px; }

  @media (max-width: 600px) { .glass-panel { padding: 30px 15px; } .01004161904-title { font-size: 2.5rem; } .owner-name { font-size: 1.2rem; } }
</style>
</head>
<body>

<div class="overlay"></div>

<div class="glass-panel">
  <h1 class="01004161904-title">Game.Over 01004161904</h1>
  <div class="owner-name">POOPS EXPLOIT</div>

  <div class="status-box">
    <div id="state">
      <span id="stateText">Loading Payload...<br><small>Please Wait</small></span>
      <div class="loader-container">
        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
      </div>
    </div>
  </div>
  
  <div id="out-container"><div id="out"></div></div>
</div>

<div class="footer">Game.Over 01004161904 SYSTEM V1.0</div>

<script type="module">
import "./chain_poops.js";

const state = document.getElementById("state");
const stateText = document.getElementById("stateText");

window.poopsDone = function () {
  state.classList.add("done");
  stateText.innerHTML = "EXPLOIT SUCCESSFUL<br><small>Done...</small>";
  document.querySelector('.loader-container').style.display = 'none';
};

window.poopsError = function () {
  state.classList.add("error");
  stateText.innerHTML = "EXPLOIT FAILED<br><small>Something went wrong...</small>";
  document.querySelector('.loader-container').style.display = 'none';
};
</script>
</body>
</html>
